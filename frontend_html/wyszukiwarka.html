<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SzwagiAIR - Wyszukaj lot</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
        margin: 0;
      }
      .search-container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 400px;
        text-align: center;
        margin-bottom: 20px;
      }
      .search-container h2 {
        color: #003366;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        color: #333;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #003366;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #002244;
      }
      #wyniki {
        width: 400px;
      }
      /* styl dla pojedynczego lotu */
      .lot-karta {
        background-color: white;
        padding: 15px;
        border-left: 5px solid #003366;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 10px;
        font-size: 14px;
      }
      .lot-karta strong {
        color: #003366;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="search-container">
      <h2>Znajdź swój lot</h2>
      <form id="searchForm">
        <div class="form-group">
          <label for="skad">Skąd (Kod lotniska, np. WAW)</label>
          <input type="text" id="skad" placeholder="Opcjonalne..." />
        </div>
        <div class="form-group">
          <label for="dokad">Dokąd (Kod lotniska, np. NYC)</label>
          <input type="text" id="dokad" placeholder="Opcjonalnie..." />
        </div>
        <button type="submit">Szukaj lotów</button>
      </form>
    </div>

    <div id="wyniki"></div>

    <script>
      document
        .getElementById("searchForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault(); // zapobiega przeładowaniu

          const wynikDiv = document.getElementById("wyniki");
          wynikDiv.innerHTML =
            '<p style="text-align:center;">Szukam najciekawszych kierunków...</p>';

          try {
            // endpoint pobierania lotów
            const response = await fetch("http://127.0.0.1:8000/operacje/loty");
            const loty = await response.json();

            wynikDiv.innerHTML = "";

            if (loty.length === 0) {
              wynikDiv.innerHTML =
                '<p style="text-align:center;">Niestety, nie znaleziono żadnych lotów w bazie.</p>';
              return;
            }

            //
            const skadFiltr = document
              .getElementById("skad")
              .value.toUpperCase();
            const dokadFiltr = document
              .getElementById("dokad")
              .value.toUpperCase();

            let znaleziono = 0;

            loty.forEach((lot) => {
              //   // zamiana danych na tekst i porównanie z filtrem
              //   const startBaza = String(lot.id_lotniska_start).toUpperCase();
              //   const celBaza = String(lot.id_lotniska_cel).toUpperCase();

              // 1. Zamiana danych na tekst
              const numerLotu = String(lot.numer_lotu || "").toUpperCase();
              const wylot = lot.id_lotniska_wylotu || "Brak";
              const przylot = lot.id_lotniska_przylotu || "Brak";

              // 2. Sprawdzenie, czy pasuje do filtrów
              const pasujeSkad =
                skadFiltr === "" || numerLotu.includes(skadFiltr); // puste pola są ok
              const pasujeDokad =
                dokadFiltr === "" || numerLotu.includes(dokadFiltr);

              // 3.Gdy oba pasują:
              if (pasujeSkad && pasujeDokad) {
                wynikDiv.innerHTML += `
                      <div class = "lot-karta">
                          <strong>Lot ${lot.numer_lotu}</strong>
                          <div class="trasa">
                            ${wylot.kod} (${wylot.miasto}) → ${przylot.kod} (${przylot.miasto})
                          </div>
                          <div class="czasy">
                            Wylot: ${wylotData}<br>
                            Przylot: ${przylotData}
                          </div>
                          <div class="cena">Cena: ${lot.cena_bazowa} PLN</div>
                          <small>Wolne miejsca: ${lot.wolne_miejsca}</small>
                          <br>
                          <button onclick="wybierzLot(${lot.id})"
                              style="margin-top:10px; background-color:#e67e22;">
                            Wybierz ten lot →
                          </button>
                      </div>
                      `;
                znaleziono++;
              }
            });

            // gdy nie znaleziono pasujących lotów
            if (znaleziono === 0) {
              wynikDiv.innerHTML =
                '<p style="text-align:center;">Brak lotów dla podanych kryteriów.</p>';
            }
          } catch (error) {
            wynikDiv.innerHTML =
              '<p style="text-align:center; color:red;">Błąd połączenia z serwerem. Uvicorn działa?</p>';
          }
        });
        
        function wybierzLot(idLotu) {
        // sprawdzamy czy zalogowany - bez tego nie ma rezerwacji
        const login = localStorage.getItem("login");
        if (!login) {
          alert("Musisz się zalogować, aby zarezerwować lot!");
          window.location.href = "index.html";
          return;
        }
        // przekierowanie do rezerwacji z ID lotu w URL
        window.location.href = `rezerwacja.html?lot_id=${idLotu}`;
      }
    </script>
  </body>
</html>
