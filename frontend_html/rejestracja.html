  <body>
    <a href="wyszukiwarka.html">← Wróć do wyszukiwarki</a>
    <h2>✈️ Rezerwacja lotu</h2>
 
    <!-- INFORMACJE O WYBRANYM LOCIE -->
    <section class="lot-info" id="lotInfo">
      <h3>Wybrany lot</h3>
      <p>Ładowanie szczegółów lotu...</p>
    </section>
 
    <!-- DANE PASAŻERA -->
    <section class="dane-pasazera">
      <h3>Dane pasażera</h3>
      <div class="form-group">
        <label>Zalogowany jako:</label>
        <input type="text" id="loginPasazera" readonly />
      </div>
      <div class="form-group">
        <label for="numerMiejsca">Numer miejsca:</label>
        <input type="text" id="numerMiejsca" placeholder="np. 12A" />
      </div>
    </section>
 
    <!-- BAGAŻ -->
    <section class="opcje">
      <h3>Bagaż</h3>
      <div class="opcja">
        <input type="radio" name="bagaz" value="0" checked /> Podręczny (w cenie)
      </div>
      <div class="opcja">
        <input type="radio" name="bagaz" value="150" /> Rejestrowany 20kg (+150 PLN)
      </div>
    </section>
 
    <!-- USŁUGI DODATKOWE -->
    <section class="opcje">
      <h3>Usługi dodatkowe</h3>
      <div id="uslugiLista">Ładowanie usług...</div>
    </section>
 
    <!-- PODSUMOWANIE -->
    <section class="podsumowanie">
      <h3>Podsumowanie</h3>
      <p>Razem: <span id="cenaRazem">0 PLN</span></p>
      <button class="btn-rezerwuj" id="rezerwujBtn">Rezerwuj</button>
      <div id="komunikat"></div>
    </section>
