<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SzwagiAIR - Rezerwacja</title>
    <link rel="stylesheet" href="css/rezerwacja.css" />
  </head>
  <body>
    <div class="container">
      <a href="wyszukiwarka.html" class="powrot">← Wróć do wyszukiwarki</a>
      <h2>✈️ Rezerwacja lotu</h2>
 
      <!-- INFORMACJE O WYBRANYM LOCIE -->
      <section class="karta lot-info" id="lotInfo">
        <h3>Wybrany lot</h3>
        <p>Ładowanie szczegółów lotu...</p>
      </section>
 
      <!-- DANE PASAŻERA -->
      <section class="karta">
        <h3>Dane pasażera</h3>
        <div class="form-group">
          <label>Zalogowany jako:</label>
          <input type="text" id="loginPasazera" readonly />
        </div>
        <div class="form-group">
          <label for="numerMiejsca">Numer miejsca (np. 12A):</label>
          <input type="text" id="numerMiejsca" placeholder="12A" maxlength="5" />
        </div>
      </section>
 
      <!-- BAGAŻ -->
      <section class="karta">
        <h3>Bagaż</h3>
        <label class="opcja">
          <input type="radio" name="bagaz" value="0" data-typ="podreczny" checked />
          <span class="nazwa">Bagaż podręczny (w cenie)</span>
          <span class="cena">0 PLN</span>
        </label>
        <label class="opcja">
          <input type="radio" name="bagaz" value="150" data-typ="rejestrowany" />
          <span class="nazwa">Bagaż rejestrowany 20kg</span>
          <span class="cena">+150 PLN</span>
        </label>
        <label class="opcja">
          <input type="radio" name="bagaz" value="250" data-typ="rejestrowany" />
          <span class="nazwa">Bagaż rejestrowany 32kg</span>
          <span class="cena">+250 PLN</span>
        </label>
      </section>
 
      <!-- USŁUGI DODATKOWE -->
      <section class="karta">
        <h3>Usługi dodatkowe</h3>
        <div id="uslugiLista">Ładowanie usług...</div>
      </section>
 
      <!-- PODSUMOWANIE -->
      <section class="karta podsumowanie">
        <h3>Podsumowanie</h3>
        <div class="linia"><span>Cena biletu</span><span id="cenaBiletu">0 PLN</span></div>
        <div class="linia"><span>Bagaż</span><span id="cenaBagazu">0 PLN</span></div>
        <div class="linia"><span>Usługi dodatkowe</span><span id="cenaUslug">0 PLN</span></div>
        <div class="linia razem"><span>RAZEM</span><span id="cenaRazem">0 PLN</span></div>
        <button class="btn-rezerwuj" id="rezerwujBtn">Rezerwuj i przejdź do płatności</button>
        <div id="komunikat"></div>
      </section>
    </div>
 
    <script src="js/rezerwacja.js"></script>
  </body>
</html>
