<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SzwagiAIR - logowanie</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 300px;
        text-align: center;
      }
      .login-container h2 {
        margin-bottom: 20px;
        color: #003366;
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        color: #333;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #003366;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #002244;
      }
      #komunikat {
        margin-top: 15px;
        font-size: 14px;
        color: red;
      }
      .link-rejestracja {
        margin-top: 20px;
        font-size: 14px;
        color: #333;
      }
      .link-rejestracja a {
        color: #003366;
        font-weight: bold;
        text-decoration: none;
      }
      .link-rejestracja a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>SzwagiAIR</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="login">Login (E-mail):</label>
          <input type="text" name="login" id="login" required />
        </div>
        <div class="form-group">
          <label for="haslo">Hasło:</label>
          <input type="password" name="haslo" id="haslo" required />
        </div>
        <button type="submit">Zaloguj się i leć</button>
      </form>
      <div id="komunikat"></div>
 
      <div class="link-rejestracja">
        Nie masz konta? <a href="rejestracja.html">Zarejestruj się</a>
      </div>
    </div>
 
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
 
          const loginValue = document.getElementById("login").value;
          const hasloValue = document.getElementById("haslo").value;
          const komunikatDiv = document.getElementById("komunikat");
 
          komunikatDiv.style.color = "black";
          komunikatDiv.innerText = "Logowanie...";
 
          try {
            // JWT/OAuth2 wymaga danych jako form-data (application/x-www-form-urlencoded),
            // NIE jako JSON. Pola muszą nazywać się 'username' i 'password'.
            const formData = new URLSearchParams();
            formData.append("username", loginValue);
            formData.append("password", hasloValue);
 
            const response = await fetch(
              "http://127.0.0.1:8000/autoryzacja/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded",
                },
                body: formData,
              },
            );
 
            const data = await response.json();
 
            if (response.ok) {
              komunikatDiv.style.color = "green";
              komunikatDiv.innerText = "Zalogowano pomyślnie! Witamy " + data.login;
 
              // zapisujemy TOKEN + dane sesji w localStorage
              localStorage.setItem("token", data.access_token);
              localStorage.setItem("login", data.login);
              localStorage.setItem("rola", data.rola);
 
              // przekierowanie zależne od roli
              setTimeout(() => {
                if (data.rola === "admin") {
                  window.location.href = "admin.html";
                } else {
                  window.location.href = "wyszukiwarka.html";
                }
              }, 1000);
            } else {
              komunikatDiv.style.color = "red";
              komunikatDiv.innerText = "Błąd: " + data.detail;
            }
          } catch (error) {
            komunikatDiv.style.color = "red";
            komunikatDiv.innerText =
              "Błąd połączenia z serwerem. Czy FastAPI działa?";
          }
        });
    </script>
  </body>
</html>
